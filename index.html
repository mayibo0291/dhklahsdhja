<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>续班数据看板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .main-container { 
            max-width: 1920px; 
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }
        
        .header { 
            grid-column: 1 / -1;
            text-align: center; 
            margin-bottom: 20px; 
            padding: 30px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .header h1 { 
            font-size: 42px; 
            color: #667eea;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .header .date { 
            font-size: 20px; 
            color: #666;
        }
        
        .left-column, .right-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: stretch;
        }
        .left-column > .section, .right-column > .section {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .section { 
            background: white; 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        .section-title { 
            font-size: 22px; 
            font-weight: bold; 
            margin-bottom: 20px; 
            padding-left: 12px;
            border-left: 5px solid #667eea;
            color: #333;
        }

        table { width: 100%; border-collapse: collapse; }
        th { 
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 12px 10px; 
            text-align: center; 
            font-weight: 600; 
            font-size: 13px;
        }
        td { 
            padding: 12px 10px; 
            border-bottom: 1px solid #f0f0f0; 
            font-size: 13px;
            text-align: center;
        }
        tr:hover { background: #f8f9ff; }
        tr:nth-child(even) { background: #fafbfc; }
        
        .rank-badge { 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px; 
            height: 30px; 
            border-radius: 50%; 
            font-weight: bold;
            font-size: 14px;
            color: white;
        }
        .rank-1 { background: linear-gradient(135deg, #FFD700, #FFA500); }
        .rank-2 { background: linear-gradient(135deg, #C0C0C0, #A0A0A0); }
        .rank-3 { background: linear-gradient(135deg, #CD7F32, #B8860B); }
        .rank-other { background: #e0e0e0; color: #666; }

        .progress-container { 
            width: 100%; 
            height: 8px; 
            background: #e9ecef; 
            border-radius: 4px; 
            overflow: hidden;
            margin-top: 4px;
        }
        .progress-bar { 
            height: 100%; 
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        
        .tag { 
            display: inline-block; 
            padding: 3px 8px; 
            border-radius: 5px; 
            font-size: 11px;
            font-weight: 500;
        }
        .tag-group { background: #e3f2fd; color: #1976d2; }
        .tag-manager { background: #fff3e0; color: #f57c00; }

        .name-cell { font-weight: 600; color: #333; }
        
        @media (max-width: 1400px) {
            .main-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header">
            <h1>📊 入口班2期续班看板</h1>
            <div class="date" id="currentDate"></div>
        </div>

        <!-- 左列：管理者排名 + 小组排名 -->
        <div class="left-column">
            <div class="section">
                <div class="section-title">🎯 管理者续班排名</div>
                <table>
                    <thead>
                        <tr>
                            <th style="width: 60px;">排名</th>
                            <th style="width: 100px;">管理者</th>
                            <th style="width: 120px;">所带小组</th>
                            <th style="width: 80px;">今日新增</th>
                            <th style="width: 200px;">综合续班完成度</th>
                        </tr>
                    </thead>
                    <tbody id="managerTable"></tbody>
                </table>
            </div>

            <div class="section">
                <div class="section-title">👥 小组续班排名</div>
                <table>
                    <thead>
                        <tr>
                            <th style="width: 60px;">排名</th>
                            <th style="width: 100px;">小组名称</th>
                            <th style="width: 90px;">管理者</th>
                            <th style="width: 80px;">今日新增</th>
                            <th style="width: 200px;">平均续班完成度</th>
                        </tr>
                    </thead>
                    <tbody id="groupTable"></tbody>
                </table>
            </div>
        </div>

        <!-- 右列：伙伴TOP15 -->
        <div class="right-column">
            <div class="section">
                <div class="section-title">🏆 伙伴续班完成度 TOP 15</div>
                <table>
                    <thead>
                        <tr>
                            <th style="width: 60px;">排名</th>
                            <th style="width: 100px;">姓名</th>
                            <th style="width: 80px;">小组</th>
                            <th style="width: 80px;">管理者</th>
                            <th style="width: 70px;">今日新增</th>
                            <th style="width: 220px;">续班完成度</th>
                        </tr>
                    </thead>
                    <tbody id="partnerTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>

                { id: '2组', manager: '兰思虹', members: ['杨婉婷', '兰思虹', '司艺薇', '吴  乐', '罗小飞'] },
                { id: '8组', manager: '兰思虹', members: ['李星雨', '张晅畅', '王亚楠', '张冰冰', '王胤之'] },
                { id: '3组', manager: '任志昊', members: ['税超兰', '梁  亮', '滕佳音', '赵  艳', '孙梦媛'] },
                { id: '5组', manager: '任志昊', members: ['孟佳怡', '史小盈', '裴一禧', '李  想', '任志昊'] },
                { id: '4组', manager: '陆佳卉', members: ['王  怡', '杨佳毅', '杨一菲', '陆佳卉', '伍  倩'] },
                { id: '7组', manager: '陆佳卉', members: ['李佳幸', '张心茹', '温  妮', '罗康杰', '张  泰'] }
            ]
        };

        // 数据源 - 直接嵌入避免跨域问题
        const partnerData = [
          {"name": "郭栩彤", "group": "1组", "manager": "郭栩彤", "renewals": 19, "target": 76, "todayNew": 0},
          {"name": "王振豪", "group": "1组", "manager": "郭栩彤", "renewals": 20, "target": 74, "todayNew": 0},
          {"name": "郗海琳", "group": "1组", "manager": "郭栩彤", "renewals": 17, "target": 72, "todayNew": 0},

          {"name": "张  乐", "group": "1组", "manager": "郭栩彤", "renewals": 18, "target": 65, "todayNew": 0},
          {"name": "景梦花", "group": "6组", "manager": "郭栩彤", "renewals": 30, "target": 97, "todayNew": 0},

          {"name": "刘亦婷", "group": "6组", "manager": "郭栩彤", "renewals": 30, "target": 96, "todayNew": 0},
          {"name": "吴海波", "group": "6组", "manager": "郭栩彤", "renewals": 30, "target": 96, "todayNew": 0},

          {"name": "兰思虹", "group": "2组", "manager": "兰思虹", "renewals": 14, "target": 84, "todayNew": 0},
          {"name": "司艺薇", "group": "2组", "manager": "兰思虹", "renewals": 12, "target": 82, "todayNew": 0},
          {"name": "吴  乐", "group": "2组", "manager": "兰思虹", "renewals": 16, "target": 79, "todayNew": 0},
          {"name": "罗小飞", "group": "2组", "manager": "兰思虹", "renewals": 16, "target": 79, "todayNew": 0},
          {"name": "李星雨", "group": "8组", "manager": "兰思虹", "renewals": 29, "target": 84, "todayNew": 0},
          {"name": "张晅畅", "group": "8组", "manager": "兰思虹", "renewals": 31, "target": 84, "todayNew": 0},
          {"name": "王亚楠", "group": "8组", "manager": "兰思虹", "renewals": 29, "target": 83, "todayNew": 0},
          {"name": "张冰冰", "group": "8组", "manager": "兰思虹", "renewals": 31, "target": 83, "todayNew": 0},
          {"name": "王胤之", "group": "8组", "manager": "兰思虹", "renewals": 31, "target": 84, "todayNew": 0},
          {"name": "税超兰", "group": "3组", "manager": "任志昊", "renewals": 11, "target": 83, "todayNew": 0},
          {"name": "梁  亮", "group": "3组", "manager": "任志昊", "renewals": 12, "target": 91, "todayNew": 0},
          {"name": "滕佳音", "group": "3组", "manager": "任志昊", "renewals": 12, "target": 86, "todayNew": 0},
          {"name": "赵  艳", "group": "3组", "manager": "任志昊", "renewals": 11, "target": 83, "todayNew": 0},
          {"name": "孙梦媛", "group": "3组", "manager": "任志昊", "renewals": 10, "target": 81, "todayNew": 0},
          {"name": "孟佳怡", "group": "5组", "manager": "任志昊", "renewals": 10, "target": 84, "todayNew": 0},
          {"name": "史小盈", "group": "5组", "manager": "任志昊", "renewals": 12, "target": 86, "todayNew": 0},
          {"name": "裴一禧", "group": "5组", "manager": "任志昊", "renewals": 11, "target": 80, "todayNew": 0},
          {"name": "李  想", "group": "5组", "manager": "任志昊", "renewals": 11, "target": 81, "todayNew": 0},
          {"name": "任志昊", "group": "5组", "manager": "任志昊", "renewals": 12, "target": 80, "todayNew": 0},
          {"name": "王  怡", "group": "4组", "manager": "陆佳卉", "renewals": 10, "target": 77, "todayNew": 0},
          {"name": "杨佳毅", "group": "4组", "manager": "陆佳卉", "renewals": 14, "target": 80, "todayNew": 0},
          {"name": "杨一菲", "group": "4组", "manager": "陆佳卉", "renewals": 9, "target": 78, "todayNew": 0},
          {"name": "陆佳卉", "group": "4组", "manager": "陆佳卉", "renewals": 12, "target": 81, "todayNew": 0},
          {"name": "伍  倩", "group": "4组", "manager": "陆佳卉", "renewals": 10, "target": 70, "todayNew": 0},
          {"name": "李佳幸", "group": "7组", "manager": "陆佳卉", "renewals": 18, "target": 81, "todayNew": 0},
          {"name": "张心茹", "group": "7组", "manager": "陆佳卉", "renewals": 18, "target": 82, "todayNew": 0},
          {"name": "温  妮", "group": "7组", "manager": "陆佳卉", "renewals": 18, "target": 81, "todayNew": 0},
          {"name": "罗康杰", "group": "7组", "manager": "陆佳卉", "renewals": 17, "target": 82, "todayNew": 0},
          {"name": "张  泰", "group": "7组", "manager": "陆佳卉", "renewals": 17, "target": 79, "todayNew": 0}
        ];

        function loadPartnerData() {
            // 计算续班完成度并返回数据
            return Promise.resolve(partnerData.map(p => ({
                ...p,
                rate: parseFloat(((p.renewals / p.target) * 100).toFixed(1))
            })));
        }

        function calculateGroupStats(partners) {
            const groupMap = {};
            orgData.groups.forEach(g => {
                groupMap[g.id] = { 
                    id: g.id, 
                    manager: g.manager, 
                    members: g.members.length,
                    totalRenewals: 0,
                    totalTarget: 0,
                    todayNew: 0
                };
            });
            
            partners.forEach(p => {
                if (groupMap[p.group]) {
                    groupMap[p.group].totalRenewals += p.renewals;
                    groupMap[p.group].totalTarget += p.target;
                    groupMap[p.group].todayNew += (p.todayNew || 0);
                }
            });
            
            Object.values(groupMap).forEach(g => {
                g.avgRate = ((g.totalRenewals / g.totalTarget) * 100).toFixed(1);
            });
            
            return Object.values(groupMap).sort((a, b) => b.avgRate - a.avgRate);
        }

        function calculateManagerStats(groupStats) {
            const managerMap = {};
            orgData.managers.forEach(m => {
                managerMap[m.name] = { 
                    name: m.name, 
                    groups: m.groups.join('、'),
                    totalMembers: 0,
                    totalRenewals: 0,
                    totalTarget: 0,
                    todayNew: 0
                };
            });
            
            groupStats.forEach(g => {
                const manager = managerMap[g.manager];
                if (manager) {
                    manager.totalMembers += g.members;
                    manager.totalRenewals += g.totalRenewals;
                    manager.totalTarget += g.totalTarget;
                    manager.todayNew += g.todayNew;
                }
            });
            
            Object.values(managerMap).forEach(m => {
                m.comprehensiveRate = ((m.totalRenewals / m.totalTarget) * 100).toFixed(1);
            });
            
            return Object.values(managerMap).sort((a, b) => b.comprehensiveRate - a.comprehensiveRate);
        }

        function renderRank(index) {
            if (index === 0) return '<span class="rank-badge rank-1">1</span>';
            if (index === 1) return '<span class="rank-badge rank-2">2</span>';
            if (index === 2) return '<span class="rank-badge rank-3">3</span>';
            return `<span class="rank-badge rank-other">${index + 1}</span>`;
        }

        function renderProgressBar(rate) {
            const width = Math.min(rate, 100);
            return `
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span style="font-weight: 600; min-width: 45px;">${rate}%</span>
                    <div class="progress-container" style="flex: 1;">
                        <div class="progress-bar" style="width: ${width}%"></div>
                    </div>
                </div>
            `;
        }

        function initDashboard() {
            const now = new Date();
            const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
            document.getElementById('currentDate').textContent = 
                `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 ${weekdays[now.getDay()]}`;

            // 从 data.json 加载真实数据
            loadPartnerData().then(partners => {
                // 按续班完成度降序排序
                partners.sort((a, b) => b.rate - a.rate);

                const groupStats = calculateGroupStats(partners);
                const managerStats = calculateManagerStats(groupStats);

                // 渲染TOP 15伙伴
                const partnerTbody = document.getElementById('partnerTable');
                partners.slice(0, 15).forEach((p, i) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${renderRank(i)}</td>
                        <td class="name-cell">${p.name}</td>
                        <td><span class="tag tag-group">${p.group}</span></td>
                        <td><span class="tag tag-manager">${p.manager}</span></td>
                        <td style="font-weight: 600; color: #667eea;">${p.todayNew || 0}</td>
                        <td>${renderProgressBar(p.rate)}</td>
                    `;
                    partnerTbody.appendChild(row);
                });

                // 渲染小组排名
                const groupTbody = document.getElementById('groupTable');
                groupStats.forEach((g, i) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${renderRank(i)}</td>
                        <td class="name-cell">${g.id}</td>
                        <td><span class="tag tag-manager">${g.manager}</span></td>
                        <td style="font-weight: 600; color: #667eea;">${g.todayNew || 0}</td>
                        <td>${renderProgressBar(parseFloat(g.avgRate))}</td>
                    `;
                    groupTbody.appendChild(row);
                });

                // 渲染管理者排名
                const managerTbody = document.getElementById('managerTable');
                managerStats.forEach((m, i) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${renderRank(i)}</td>
                        <td class="name-cell">${m.name}</td>
                        <td>${m.groups}</td>
                        <td style="font-weight: 600; color: #667eea;">${m.todayNew || 0}</td>
                        <td>${renderProgressBar(parseFloat(m.comprehensiveRate))}</td>
                    `;
                    managerTbody.appendChild(row);
                });
            }).catch(error => {
                console.error('加载数据失败:', error);
                alert('无法加载 data.json，请确保文件存在且格式正确');
            });
        }

        window.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>
</html>
